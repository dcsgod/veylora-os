<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{APP_TITLE}}</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top"><strong id="app-title">{{APP_TITLE}}</strong></header>
  <main id="app">
    <section id="features"></section>
    <section class="card">
      <h2>Items</h2>
      <form id="item-form" class="row">
        <input name="title" placeholder="New item" required maxlength="200">
        <button type="submit">Add</button>
      </form>
      <ul id="items"></ul>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
