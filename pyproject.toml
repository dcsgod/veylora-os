[project]
name = "veylora-os"
version = "0.1.0"
description = "Veylora OS local orchestration runtime. From intent to working systems."
requires-python = ">=3.11"
license = { text = "Proprietary - all rights reserved until a license is chosen" }
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "pydantic==2.11.4",
  "httpx==0.28.1",
  "pyyaml==6.0.2",
  "psutil==7.0.0",
]

[project.optional-dependencies]
browser = ["playwright==1.52.0"]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "pyinstaller==6.13.0",
]

[project.scripts]
veylora-backend = "backend.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "integrations"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["real_inference: requires a running local model runtime (opt-in via VEYLORA_REAL_INFERENCE=1)"]
